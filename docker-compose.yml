services:
  postgres:
    image: postgres:17-alpine
    container_name: resume_optimizer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume_local_dev
      POSTGRES_DB: resume_optimizer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
